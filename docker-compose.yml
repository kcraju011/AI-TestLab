services:
  postgres:
    image: postgres:16
    container_name: ai-testlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_testlab
      POSTGRES_USER: ai_testlab_user
      POSTGRES_PASSWORD: change_this_local_password
    ports:
      - "5434:5432"
    volumes:
      - ai_testlab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_testlab_user -d ai_testlab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai_testlab_postgres_data: